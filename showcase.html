<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F8F9F4">
  <title>闲置无忧</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="showcase.css">
</head>
<body>
  <header class="showcase-header">
    <div class="showcase-brand"><img src="assets/logo.svg" alt=""><h1>闲置无忧</h1></div>
    <nav class="group-nav" aria-label="界面分组">
      <button type="button" data-group="main">主界面</button>
      <button type="button" data-group="pages">主要跳转页</button>
      <button type="button" data-group="auth">登录注册</button>
      <button type="button" data-group="onboarding">新手引导</button>
    </nav>
  </header>
  <main id="gallery" class="gallery" tabindex="-1"></main>
  <dialog id="viewer" class="viewer" aria-labelledby="viewer-title">
    <div class="viewer-toolbar"><h2 id="viewer-title"></h2><button type="button" id="close-viewer" class="viewer-icon" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <div class="viewer-body"><button type="button" id="previous-page" class="viewer-icon previous" aria-label="上一页"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><div class="viewer-stage"><img id="viewer-image" alt=""></div><button type="button" id="next-page" class="viewer-icon next" aria-label="下一页"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button></div>
  </dialog>
  <script src="showcase.js"></script>
</body>
</html>
